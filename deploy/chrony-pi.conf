# deploy/chrony-pi.conf
# Install ON THE PI as /etc/chrony/conf.d/maverick.conf:
#   sudo apt install chrony
#   sudo cp deploy/chrony-pi.conf /etc/chrony/conf.d/maverick.conf
#   sudo systemctl restart chrony
# Verify from the Jetson with: chronyc tracking
#
# The Pi is the ONLY time source in the truck (no internet). The Jetson's
# vision frames and the Pi's OBD readings are aligned by timestamp, so the two
# clocks agreeing is what makes snapshot/reading correlation meaningful — see
# jetson/deploy/chrony-jetson.conf for the client half.

# Serve time to the Jetson. Both subnets are allowed because the Jetson may sit
# on the direct ethernet link (192.168.100.0/24) or, during bench work, on the
# household LAN.
allow 192.168.100.0/24
allow 10.0.0.0/24

# Serve our own clock even when no upstream is reachable. Without this the Pi
# refuses to distribute time while unsynchronised, and the Jetson would sit in
# "waiting for clock sync" forever in exactly the offline case this system is
# built for. Stratum 10 keeps a real upstream (when the Pi has WiFi at home)
# strictly preferred over this fallback.
local stratum 10

# deploy/mosquitto-maverick.conf
# Install ON THE PI:
#   sudo cp deploy/mosquitto-maverick.conf /etc/mosquitto/conf.d/maverick.conf
#   sudo systemctl restart mosquitto
#
# Mosquitto 2.x binds to localhost only by default. The Pi's own processes
# (db_writer, trip_manager, obd_poller, the Express bridge) are all local and
# work fine with that default — but the Jetson publishes camera frames from
# another machine, so the broker has to accept off-box connections or
# maverick/vision/* never arrives.

# Listen on all interfaces: the Jetson may reach the Pi either over the direct
# ethernet link (192.168.100.1) or over WiFi, and the Pi's WiFi address is
# DHCP-assigned. Binding to one address would break the other path.
listener 1883 0.0.0.0

# No authentication. This is a closed, offline, in-vehicle network — the Pi is
# not internet-facing and the only peer is the Jetson on a direct cable. If this
# broker is ever exposed to a shared/untrusted network, replace this with a
# password_file and set allow_anonymous false, and add matching credentials to
# the Jetson's vision_publisher environment.
allow_anonymous true

# NOTE: do NOT set persistence/persistence_location here. Debian's default
# /etc/mosquitto/mosquitto.conf already enables persistence to
# /var/lib/mosquitto/, and mosquitto treats a redeclared persistence_location
# as a FATAL duplicate ("Error: Duplicate persistence_location value"), so the
# broker refuses to start. This drop-in is included from that file, so the
# defaults already apply here.
